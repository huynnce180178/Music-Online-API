plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.4'
    id 'io.spring.dependency-management' version '1.1.6'
    id 'org.jetbrains.kotlin.jvm'
}

group = 'com.ra'
version = '0.0.1-SNAPSHOT'

// ❌ Đã gỡ toolchain để Railway dùng JAVA_VERSION mặc định từ biến môi trường
// java {
//     toolchain {
//         languageVersion = JavaLanguageVersion.of(17)
//     }
// }

jar {
    enabled = false
}

bootJar {
    archiveFileName = 'music-online-api.jar'
    mainClass = 'com.ra.base_spring_boot.BaseSpringBootApplication'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.5.0'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'com.cloudinary:cloudinary-http44:1.31.0'
    implementation 'com.google.genai:google-genai:1.0.0'
    implementation 'com.paypal.sdk:rest-api-sdk:1.14.0'
    implementation 'org.json:json:20240303'
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    implementation 'com.alphacephei:vosk:0.3.38'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation group: 'io.jsonwebtoken', name: 'jjwt-api', version: '0.11.2'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-impl', version: '0.11.2'
    runtimeOnly group: 'io.jsonwebtoken', name: 'jjwt-jackson', version: '0.11.2'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    implementation 'com.mpatric:mp3agic:0.9.1'
    implementation 'com.sun.mail:jakarta.mail:2.0.1'
    implementation 'jakarta.mail:jakarta.mail-api'
    implementation 'org.eclipse.angus:jakarta.mail'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    configurations.all {
        exclude group: 'commons-logging', module: 'commons-logging'
    }

    // Spring Boot starter logging (includes Logback by default)
    implementation 'org.springframework.boot:spring-boot-starter-logging'
}

tasks.named('test') {
    useJUnitPlatform()
}
